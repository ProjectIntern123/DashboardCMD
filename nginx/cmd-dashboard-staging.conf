# =========================================================================
# HARTEK Group CMD Office Command Center - Staging Nginx Configuration
# Target OS: Ubuntu Linux (Hostinger KVM VPS)
# =========================================================================
# Replace STAGING_DOMAIN.com with your actual staging domain
# (e.g., staging.cmd.hartek.com)
#
# TWO-STAGE DEPLOYMENT & VERIFICATION RUNBOOK:
# DO NOT enable or link this full SSL configuration into sites-enabled until
# certificates exist, or 'nginx -t' will fail due to missing .pem files.
#
# Stage 1: Obtain Certificate via HTTP Webroot (port 80):
#   1. Confirm DNS A record resolves to staging VPS IP:
#      dig +short STAGING_DOMAIN.com
#   2. Ensure default Nginx site or temporary HTTP block serves /.well-known/acme-challenge/
#   3. Obtain certificates via Certbot:
#      sudo certbot certonly --webroot -w /var/www/html -d STAGING_DOMAIN.com
#   4. Verify certificate files exist on disk:
#      ls -l /etc/letsencrypt/live/STAGING_DOMAIN.com/fullchain.pem
#
# Stage 2: Activate Staging Reverse Proxy:
#   1. Substitute domain in this configuration:
#      sudo cp nginx/cmd-dashboard-staging.conf /etc/nginx/sites-available/cmd-dashboard-staging.conf
#      sudo sed -i 's/STAGING_DOMAIN.com/<actual-domain>/g' /etc/nginx/sites-available/cmd-dashboard-staging.conf
#   2. Symlink to enabled sites:
#      sudo ln -sf /etc/nginx/sites-available/cmd-dashboard-staging.conf /etc/nginx/sites-enabled/
#   3. Validate syntax (mandatory before reload):
#      sudo nginx -t
#   4. Reload Nginx:
#      sudo systemctl reload nginx
#
# Stage 3: Verification (Strict SSL Validation):
#   1. Verify HTTP to HTTPS redirection:
#      curl -I http://STAGING_DOMAIN.com
#      (Expect: HTTP/1.1 301 Moved Permanently with Location: https://STAGING_DOMAIN.com/...)
#   2. Verify HTTPS certificate chain and validity (DO NOT use -k / --insecure):
#      curl -I https://STAGING_DOMAIN.com
#      (Expect: HTTP/2 200 or 307 with valid certificate)
#   3. Verify TLS handshake and certificate chain:
#      openssl s_client -connect STAGING_DOMAIN.com:443 -servername STAGING_DOMAIN.com < /dev/null
#      (Expect: Verify return code: 0 (ok))
#   4. Verify upstream health via reverse proxy:
#      curl -I https://STAGING_DOMAIN.com/api/settings/public
#      (Expect: HTTP/2 200)
#
# ACCESS CONTROL NOTICE:
# 'X-Robots-Tag: noindex' suppresses search engine indexing only.
# It does NOT provide access control or restrict visitor traffic.
# Access control is enforced at the application layer via JWT authentication.
# Optional network-layer access control (HTTP Basic Auth or IP allowlisting)
# can be added to this server block if private access restriction is required.
# =========================================================================

# 1. HTTP Server Block (Redirects HTTP to HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name STAGING_DOMAIN.com;

    # Certbot challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server Block (Staging Reverse Proxy)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name STAGING_DOMAIN.com;

    # Let's Encrypt SSL Certificates (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/STAGING_DOMAIN.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/STAGING_DOMAIN.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Search Engine Indexing Suppression (MANDATORY FOR STAGING)
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Request Body Size Limit for Large File/MIS Uploads
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Staging Backend API Proxy (NestJS listening on port 4001)
    location /api/ {
        proxy_pass http://127.0.0.1:4001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Staging Frontend Application Proxy (Next.js listening on port 3001)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
